name: 每日更新开奖数据

# ⚠️ 这里刻意没有配 schedule（定时触发），原因是实测不行：
#     官方接口 www.cwl.gov.cn 会拒绝境外 IP。2026-09-14 手动跑过一次，
#     日志里是「抓取失败（已重试 4 次）: HTTP Error 403: Forbidden」，
#     GitHub 的服务器在美国，拿不到数据。定时跑只会每天失败发一封邮件。
#   现在的自动更新由本机（国内网络）的计划任务负责：
#     scripts/auto_update_push.py + 更新并发布.bat
#   这个 workflow 保留手动触发，换网络环境或临时补数据时可以用。
on:
  workflow_dispatch:      # 也可以在 Actions 页面点「Run workflow」手动跑一次

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取开奖并重建网页
        run: python scripts/refresh_all.py

      - name: 提交变化
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交。"
            exit 0
          fi
          LAST=$(python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path('data/all/history_official_all_features.json').read_text(encoding='utf-8'))
          last = rows[-1]
          print(f"{last['issue']} ({last['date']} 开 {last['number']})")
          PY
          )
          git commit -m "chore(data): 自动更新开奖数据至 ${LAST}"
          git push
          echo "已提交并推送：${LAST}"
